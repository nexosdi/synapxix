services:
  postgres-keycloak:
    image: docker.io/library/postgres:15-alpine
    container_name: staging-keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:?Set KEYCLOAK_DB_NAME in the staging environment}
      POSTGRES_USER: ${KEYCLOAK_DB_USER:?Set KEYCLOAK_DB_USER in the staging environment}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in the staging environment}
    volumes:
      - staging_postgres_keycloak_data:/var/lib/postgresql/data
    networks:
      - staging-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-app:
    image: docker.io/library/postgres:15-alpine
    container_name: staging-app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${APP_DB_NAME:?Set APP_DB_NAME in the staging environment}
      POSTGRES_USER: ${APP_DB_USER:?Set APP_DB_USER in the staging environment}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in the staging environment}
    volumes:
      - staging_postgres_app_data:/var/lib/postgresql/data
    networks:
      - staging-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.2
    container_name: staging-keycloak-server
    restart: unless-stopped
    command:
      # This compose file is for local/integration testing only, not production.
      - start-dev
      - --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?Set KEYCLOAK_ADMIN in the staging environment}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in the staging environment}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/${KEYCLOAK_DB_NAME:?Set KEYCLOAK_DB_NAME in the staging environment}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:?Set KEYCLOAK_DB_USER in the staging environment}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in the staging environment}
      KC_DB_SCHEMA: public
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:?Set KEYCLOAK_PUBLIC_URL in the staging environment}
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: 8080
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - ./keycloak/realm-synapxix.json:/opt/keycloak/data/import/realm-synapxix.json:ro,z
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    networks:
      - staging-network
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  neo4j:
    image: docker.io/library/neo4j:5.26.0
    container_name: staging-synapxix-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:?Set NEO4J_USERNAME in the staging environment}/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in the staging environment}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*"
    volumes:
      - staging_neo4j_data:/data
    networks:
      - staging-network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: staging-synapxix-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in the staging environment}
    volumes:
      - staging_redis_data:/data
    networks:
      - staging-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in the staging environment}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: staging-synapxix-server
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${APP_DB_USER:?Set APP_DB_USER in the staging environment}:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in the staging environment}@postgres-app:5432/${APP_DB_NAME:?Set APP_DB_NAME in the staging environment}?schema=public
      - REDIS_URL=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in the staging environment}@redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD in the staging environment}
      - KEYCLOAK_URL=http://keycloak:8080
      # Discovery/JWKS stays on the private Compose network; issuer must match public Keycloak URL.
      - KEYCLOAK_REALM_URL=http://keycloak:8080/realms/Synapxix
      - KEYCLOAK_EXPECTED_ISSUER=${KEYCLOAK_PUBLIC_URL:?Set KEYCLOAK_PUBLIC_URL in the staging environment}/realms/Synapxix
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=${NEO4J_USERNAME:?Set NEO4J_USERNAME in the staging environment}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in the staging environment}
      - GOOGLE_GEN_AI_KEY=${GOOGLE_GEN_AI_KEY:?Set GOOGLE_GEN_AI_KEY in the staging environment}
    ports:
      - "3000:3000"
    depends_on:
      postgres-app:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - staging-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  web-game:
    build:
      context: .
      dockerfile: web-game/Dockerfile
    container_name: staging-synapxix-web-game
    restart: unless-stopped
    ports:
      - "4200:80"
    networks:
      - staging-network
    depends_on:
      server:
        condition: service_healthy

  admin-frontend:
    build:
      context: .
      dockerfile: admin-frontend/Dockerfile
    container_name: staging-synapxix-admin
    restart: unless-stopped
    ports:
      - "4201:80"
    networks:
      - staging-network
    depends_on:
      server:
        condition: service_healthy

volumes:
  staging_postgres_keycloak_data:
  staging_postgres_app_data:
  staging_neo4j_data:
  staging_redis_data:

networks:
  staging-network:
    driver: bridge
